name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generated file is up to date
        run: python3 build.py --check
      - name: Tests (no GTK or systemd needed)
        run: |
          python3 test_build.py
          python3 -m unittest test_reveille
      - name: Window smoke test (GTK 4 and libadwaita under Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
          xvfb-run -a /usr/bin/python3 -m unittest test_gui
